services:
  web:
    build:
      context: .
      dockerfile: ./compose/local/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/usr/src/app/
    ports:
      - "8000:8000"
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=yapify
      - POSTGRES_USER=yapify
      - POSTGRES_PASSWORD=yapify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
