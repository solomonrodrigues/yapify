components:
  schemas:
    AppConfigResponse:
      type: object
      properties:
        minimum_version:
          type: string
        ios_store_url:
          type: string
          nullable: true
        android_store_url:
          type: string
          nullable: true
      required:
      - android_store_url
      - ios_store_url
      - minimum_version
    CustomTokenObtainPair:
      type: object
      description: Custom JWT token serializer
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DeviceToken:
      type: object
      properties:
        token:
          type: string
          pattern: ^ExponentPushToken\[.+\]$
      required:
      - token
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_by:
          allOf:
          - $ref: '#/components/schemas/MinimalUser'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        is_admin:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - is_admin
      - member_count
      - name
    GroupCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
      required:
      - name
    GroupInvite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/Group'
          readOnly: true
        invited_by:
          allOf:
          - $ref: '#/components/schemas/MinimalUser'
          readOnly: true
        invited_user:
          allOf:
          - $ref: '#/components/schemas/MinimalUser'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: pending
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - group
      - id
      - invited_by
      - invited_user
    GroupMember:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/MinimalUser'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - joined_at
      - user
    KindEnum:
      enum:
      - user
      - quote
      type: string
      description: |-
        * `user` - user
        * `quote` - quote
    MarkAllReadResponse:
      type: object
      properties:
        message:
          type: string
        count:
          type: integer
      required:
      - count
      - message
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    MinimalUser:
      type: object
      description: User serializer including minimum necessary fields
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        profile_color:
          allOf:
          - $ref: '#/components/schemas/ProfileColorEnum'
          readOnly: true
      required:
      - display_name
      - id
      - profile_color
      - username
    Notification:
      type: object
      description: Serializer for grouped notification records.
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        actors:
          type: array
          items:
            $ref: '#/components/schemas/MinimalUser'
          readOnly: true
        actor_count:
          type: integer
          maximum: 9223372036854775807
