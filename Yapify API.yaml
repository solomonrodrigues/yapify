openapi: 3.0.3
info:
  title: Yapify API
  version: 1.0.0
  description: An app to share quotes that your friends have said.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Custom JWT login endpoint
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/auth/me/:
    delete:
      operationId: auth_me_destroy
      description: Permanently deletes the authenticated user's account and all associated
        data. Quotes posted by friends where this user appears as the quoted user
        are preserved with their display name snapshotted, so friends' content is
        not lost.
      summary: Delete account
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Account deleted
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Request a password reset code to be sent to the provided email
        address.
      summary: Request password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Confirm password reset using the code received via email and set
        a new password.
      summary: Confirm password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Wraps simplejwt's TokenRefreshView to update last_refreshed_at on the specific
        device making the request. The client optionally passes `push_token` in the
        request body alongside `refresh`. Only that token's timestamp is updated —
        not all of the user's tokens — so a stale token on a logged-out device is
        not kept alive by activity on a different device.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: User registration endpoint
      summary: Register a new user
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      summary: Resend email verification code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerification'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Verify a user's email address using the 6-digit code sent to their
        inbox.Returns JWT tokens on success so the user is logged in immediately.
      summary: Verify email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/config/:
    get:
      operationId: config_retrieve
      description: Public endpoint returning the minimum supported app version and
        store URLs.
      summary: Get app config
      tags:
      - config
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
          description: ''
  /api/devices/:
    post:
      operationId: devices_create
      description: Register or deregister an Expo push token for the authenticated
        user.
      summary: Register device push token
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceToken'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
    delete:
      operationId: devices_destroy
      description: Register or deregister an Expo push token for the authenticated
        user.
      summary: Deregister device push token
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/groups/:
    get:
      operationId: groups_list
      description: List user's groups / create a new group.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupList'
          description: ''
    post:
      operationId: groups_create
      description: List user's groups / create a new group.
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCreate'
          description: ''
  /api/groups/{group_id}/:
    get:
      operationId: groups_retrieve
      description: Retrieve / rename (admin) / delete (admin) a group.
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: groups_partial_update
      description: Retrieve / rename (admin) / delete (admin) a group.
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: groups_destroy
      description: Retrieve / rename (admin) / delete (admin) a group.
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/groups/{group_id}/invite/:
    post:
      operationId: groups_invite_create
      description: Invite a user to a group (any member).
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/groups/{group_id}/leave/:
    post:
      operationId: groups_leave_create
      description: Leave a group.
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/groups/{group_id}/members/:
    get:
      operationId: groups_members_list
      description: List members of a group.
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupMemberList'
          description: ''
  /api/groups/{group_id}/members/{user_id}/:
    delete:
      operationId: groups_members_destroy
      description: Kick a member from a group (admin only).
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/groups/invites/:
    get:
      operationId: groups_invites_list
      description: List pending group invites received by the current user.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupInviteList'
          description: ''
  /api/groups/invites/{invite_id}/:
    delete:
      operationId: groups_invites_destroy
      description: Cancel a sent invite (inviter or admin).
      parameters:
      - in: path
        name: invite_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/groups/invites/{invite_id}/respond/:
    post:
      operationId: groups_invites_respond_create
      description: Accept or decline a group invite.
      parameters:
      - in: path
        name: invite_id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/guesses/create/:
    post:
      operationId: guesses_create_create
      tags:
      - guesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteGuess'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteGuess'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteGuess'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteGuessCreateResponse'
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      description: |-
        List user notifications.

        Groups are pre-built by the pipeline (one row per type/quote/friendship).
        Actor User objects are batch-fetched in one query per page and blocked
        actors are stripped in Python.  Groups where all actors are blocked are
        excluded from the response.
      summary: List notifications
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/{notification_id}/:
    delete:
      operationId: notifications_destroy
      description: Delete a single notification
      summary: Delete a notification
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/notifications/{notification_id}/read/:
    post:
      operationId: notifications_read_create_2
      description: Mark notification as read
      summary: Mark a notification as read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/notifications/{notification_id}/unread/:
    post:
      operationId: notifications_unread_create
      description: Mark notification as unread
      summary: Mark a notification as unread
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/notifications/read/:
    post:
      operationId: notifications_read_create
      description: Mark all notifications as read.
      summary: Mark all notifications as read
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
          description: ''
  /api/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: Return the count of unread notifications
      summary: Get unread notification count
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
          description: ''
  /api/profile/:
    get:
      operationId: profile_retrieve
      description: User profile endpoint
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: profile_update
      description: User profile endpoint
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: profile_partial_update
      description: User profile endpoint
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/quotes/:
    get:
      operationId: quotes_list
      description: List and create quotes
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - quotes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
    post:
      operationId: quotes_create
      description: List and create quotes
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Quote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Quote'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
  /api/quotes/{id}/:
    get:
      operationId: quotes_retrieve
      description: Quote detail view
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
    put:
      operationId: quotes_update
      description: Quote detail view
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Quote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Quote'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
    patch:
      operationId: quotes_partial_update
      description: Quote detail view
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuote'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
    delete:
      operationId: quotes_destroy
      description: Quote detail view
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/quotes/{quote_id}/assign-user/:
    post:
      operationId: quotes_assign_user_create
      description: |-
        Allow the author of a quote to replace a quoted_name with a quoted_user.
        The quoted_user must be a friend of the author.
      summary: Assign a user to a quote
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteAssignUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteAssignUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteAssignUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
  /api/quotes/{quote_id}/guesses/:
    get:
      operationId: quotes_guesses_list
      description: |-
        List all guesses for a specific quote.

        Only accessible to:
        - Users who have guessed on this quote
        - The author of the quote
        - The quoted user
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteGuessListItemList'
          description: ''
  /api/quotes/{quote_id}/hide/:
    post:
      operationId: quotes_hide_create
      description: |-
        Hide / unhide a quote.

        POST   -> ensure quote is hidden for the current user.
        DELETE -> ensure quote is not hidden for the current user.
      summary: Hide a quote
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
    delete:
      operationId: quotes_hide_destroy
